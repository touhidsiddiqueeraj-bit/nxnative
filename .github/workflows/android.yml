# nxnative for Android: continuous integration and release delivery.
#
# CI (pushes and pull requests): the Python tooling tests (the Android packer and workflow, the
# shared pipeline's own suite on a Linux host) and the Android app build (JDK 17, the Android SDK
# with the NDK and CMake, Gradle): libdmhost.so - the host (dm/host + dm/gfx) and the Vulkan layer -
# compiled against a real game profile from dm/games, which is what a packed APK builds against too.
# The game files themselves never run through CI: nothing of any game is in this repository; the
# shell APK this builds is the template a packed one replaces (scripts/build_apk_from_nsp.py).
#
# CD (a tag v*): the same build, assembled as the release APK, debug-signed for installing, and
# attached to a GitHub release. A packed game's APK is built on a machine with its NSPs
# (build_apk_from_nsp.py); when the base64 keystore secrets are configured (KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS, KEYSTORE_ALIAS_PASSWORD) the release is signed with them.
name: android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'dm/android/**'
      - 'dm/host/**'
      - 'dm/gfx/**'
      - 'dm/games/**'
      - 'dm/tools/**'
      - 'scripts/build_apk_from_nsp.py'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write   # the release job attaches the APK to the tag's release

env:
  # A real, committed game profile the host compiles against (the same header a packed APK builds
  # with; Mario Wonder's tables are in the repository). The app template carries no game files.
  GAME: '010015100B514000'

jobs:
  tests:
    name: Python tests (Android tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the tools' Python dependencies
        run: python3 -m pip install pytest lz4 capstone fonttools
      - name: Android tool tests
        run: python3 -m pytest dm/android/tests -q
      - name: The pipeline script parses
        run: python3 -m py_compile scripts/build_apk_from_nsp.py dm/android/tools/pack_apk.py dm/android/tools/gen_build_android.py

  build:
    name: Build the app (libdmhost.so)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest preinstalls the Android SDK (ANDROID_HOME, cmdline-tools on PATH); the
      # setup-android action's own "sdkmanager tools" step breaks on current runners (the legacy
      # 'tools' package left the repository), so the workflow only adds what it needs:
      - name: Install the NDK and CMake
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" >/dev/null
      - name: Gradle (assembleDebug; the host compiles for profile ${{ env.GAME }})
        working-directory: dm/android
        run: |
          export GAME="$GAME"
          ./gradlew assembleDebug --no-daemon --stacktrace    # the committed wrapper (Gradle 8.7)
      - name: Check the library and the APK came out
        run: |
          test -f dm/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l dm/android/app/build/outputs/apk/debug/app-debug.apk | grep libdmhost.so
      - uses: actions/upload-artifact@v4
        with:
          name: nxnative-android-debug
          path: dm/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  release:
    name: Release APK (tag)
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest preinstalls the Android SDK (ANDROID_HOME, cmdline-tools on PATH), as the build
      # job's comment says; the wrapper brings its own Gradle
      - name: Install the NDK, CMake and the build tools
        run: sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1" "build-tools;34.0.0" >/dev/null
      - name: Gradle (assembleRelease; the host compiles for profile ${{ env.GAME }})
        working-directory: dm/android
        run: |
          export GAME="$GAME"
          ./gradlew assembleRelease --no-daemon --stacktrace    # the committed wrapper (Gradle 8.7)
      - name: Sign (when the keystore secrets are configured), else keep the debug-signed build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          set -eu
          APK=dm/android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT=nxnative-${GITHUB_REF_NAME}-android.apk
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks release.keystore \
              --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$KEYSTORE_PASSWORD" --key-pass "pass:$KEY_ALIAS_PASSWORD" \
              --out "$OUT" "$APK"
            rm release.keystore
          else
            # No keystore configured: the debug key signs it, so the artifact installs (CI-only;
            # replace it with your own key for distribution)
            "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks ~/.android/debug.keystore \
              --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
              --out "$OUT" "$APK"
          fi
          ls -lh "$OUT"
      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          files: nxnative-*-android.apk
          generate_release_notes: true
