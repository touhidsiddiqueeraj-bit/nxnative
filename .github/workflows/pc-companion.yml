# nxnative's PC companion as standalone executables: the window and the whole build pipeline
# (run_as_python) in one file per platform - Linux, Windows and a universal2 macOS build - so a
# user needs no Python of their own for the window. dm/android/tools/freeze.py packs it; the
# repository itself, bash, make, python3, dotnet, Java and the Android SDK stay outside (the
# companion's Toolchain window guides them in).
#
# CI (pushes and pull requests touching the involved files): the three builds plus two smoke tests
# each - the --check report runs, and a script handed to the executable imports every third-party
# module the pipeline uses (lz4, capstone, fontTools, nsz, the zstd binding) and exercises a
# ProcessPoolExecutor, the shader split's own worker mechanism (a spawn child re-runs a windowed
# executable; freeze_support answers it).
#
# CD (a tag v*): the same builds, packaged (zip on Windows, tar.gz elsewhere) and attached to the
# GitHub release, named after the version pc_companion.py carries.
name: pc-companion

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'dm/android/tools/pc_companion.py'
      - 'dm/android/tools/freeze.py'
      - 'dm/android/tests/test_pc_companion.py'
      - 'scripts/build_ipa_from_nsp.py'
      - 'scripts/build_apk_from_nsp.py'
      - '.github/workflows/pc-companion.yml'
  workflow_dispatch:

permissions:
  contents: write   # the release job attaches the executables to the tag's release

jobs:
  build:
    name: Build ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-universal2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the version the pipeline's zstd backport targets (3.14+ carries zstd itself)
      - name: The freeze toolchain
        run: python3 -m pip install pyinstaller lz4 capstone fonttools backports.zstd nsz
      - name: "Freeze (one executable: the window and the pipeline)"
        run: python3 dm/android/tools/freeze.py staging
      - name: "Smoke: the --check report runs"
        shell: bash
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS) EXE=staging/nxcompanion.app/Contents/MacOS/nxcompanion ;;
            Windows) EXE=staging/nxcompanion.exe ;;
            *) EXE=staging/nxcompanion ;;
          esac
          "$EXE" --check && rc=0 || rc=$?
          # exit 1 is the report's own 'not ready' on a bare runner; anything else is a crash
          [ "$rc" -le 1 ] || exit "$rc"
          echo "--check exited $rc (0 ready, 1 not ready on a bare runner)"
      - name: "Smoke: the pipeline's modules and workers run inside it"
        shell: bash
        timeout-minutes: 15
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS) EXE=staging/nxcompanion.app/Contents/MacOS/nxcompanion ;;
            Windows) EXE=staging/nxcompanion.exe ;;
            *) EXE=staging/nxcompanion ;;
          esac
          cat > smoke_modules.py <<'EOF'
          # every third-party module the pipeline imports at run time, imported inside the executable
          import lz4.block, lz4.frame, capstone, capstone.arm64
          from fontTools.ttLib import TTFont
          import nsz
          from backports import zstd
          zstd.ZstdDecompressor().decompress(zstd.ZstdCompressor().compress(b'zstd inside'))   # shader_split's own call
          open('smoke-modules.txt', 'w').write('modules ok')
          EOF
          echo 'smoke: modules...'
          "$EXE" smoke_modules.py
          cat smoke-modules.txt
          echo "smoke: the spawn pool (the shader split's worker mechanism)..."
          if [ "${{ runner.os }}" = Windows ]; then
            echo 'smoke: the pool runs in the diagnosis step below on Windows'
            exit 0
          fi
          cat > smoke_pool.py <<'EOF'
          # a spawn child re-runs a windowed executable; freeze_support must answer it
          import multiprocessing
          from concurrent.futures import ProcessPoolExecutor
          def twice(x): return x * 2
          if __name__ == '__main__':
              open('smoke-pool.txt', 'w').write('start method: ' + multiprocessing.get_start_method() + '\n')
              multiprocessing.set_start_method('spawn', force=True)
              with ProcessPoolExecutor(1) as ex:
                  open('smoke-pool.txt', 'a').write(repr(sorted(ex.map(twice, [1, 2, 3]))))
          EOF
          # a windowed child prints nowhere: watch it from outside, and on a hang show what it got to write
          python3 - "$EXE" <<'EOF' || { echo '--- smoke-pool.txt:'; cat smoke-pool.txt 2>/dev/null || echo '(nothing: the pool never started)'; exit 1; }
          import subprocess, sys, time
          t0 = time.time()
          try:
              r = subprocess.run([sys.argv[1], 'smoke_pool.py'], capture_output=True, timeout=600)
          except subprocess.TimeoutExpired:
              print(f'still running after {time.time()-t0:.0f}s'); sys.exit(1)
          print(f'pool smoke exit {r.returncode} after {time.time()-t0:.0f}s')
          sys.exit(r.returncode or 0)
          EOF
          cat smoke-pool.txt
          grep -F '[2, 4, 6]' smoke-pool.txt
      - name: Package
        shell: bash
        run: |
          set -eu
          V=$(python3 -c 'import re; print(re.search(r"VERSION = .([0-9.]+).", open("dm/android/tools/pc_companion.py").read()).group(1))')
          cd staging
          if [ "${{ runner.os }}" = Windows ]; then
            tar -a -cf "../nxcompanion-$V-${{ matrix.name }}.zip" nxcompanion.exe   # bsdtar: -a picks zip from the extension
          elif [ "${{ runner.os }}" = macOS ]; then
            tar czf "../nxcompanion-$V-${{ matrix.name }}.tar.gz" nxcompanion.app
          else
            tar czf "../nxcompanion-$V-${{ matrix.name }}.tar.gz" nxcompanion
          fi
          cd ..
          ls -lh nxcompanion-*
      - name: Diagnose a Windows hang in the spawn children
        if: runner.os == 'Windows'
        shell: bash
        timeout-minutes: 12
        run: |
          set -eu
          mkdir -p diag
          # one console variant (a console sits behind the window) beside the windowed one: which of
          # the two hangs tells whether the windowed bootloader is the cause
          python3 dm/android/tools/freeze.py --console diag-staging >/dev/null 2>&1 || { echo 'the console freeze failed'; exit 0; }
          cat > diag_probe.py <<'EOF'
          # breadcrumbs everywhere: a windowed child prints nowhere, but it can write files
          import multiprocessing, os, sys, time
          def note(s): open('diag/probe.txt', 'a').write(f'{time.time():.1f} pid {os.getpid()}: {s}\n')
          def work(x): note('the worker ran'); return x * 2
          if __name__ == '__main__':
              note(f'this is {sys.executable}, start method {multiprocessing.get_start_method()}')
              multiprocessing.set_start_method('spawn', force=True)
              p = multiprocessing.Process(target=work, args=(21,))
              p.start(); p.join(60)
              note(f'the Process exited with {p.exitcode}')
              from concurrent.futures import ProcessPoolExecutor
              with ProcessPoolExecutor(1) as ex:
                  note(f'the pool says {list(ex.map(work, [21]))}')
              note('done')
          EOF
          for exe in staging/nxcompanion.exe diag-staging/nxcompanion.exe; do
            echo "probing $exe..."
            rm -f diag/probe.txt
            python3 - "$exe" <<'EOF' || true
            import subprocess, sys, time
            t0 = time.time()
            try:
                r = subprocess.run([sys.argv[1], 'diag_probe.py'], capture_output=True, timeout=180)
                print(f'{sys.argv[1]} exit {r.returncode} after {time.time()-t0:.0f}s')
            except subprocess.TimeoutExpired:
                print(f'{sys.argv[1]} STILL RUNNING after {time.time()-t0:.0f}s')
            EOF
            echo "--- $exe, diag/probe.txt:"; cat diag/probe.txt 2>/dev/null || echo '(nothing written)'
          done
          exit 0   # the diagnosis never fails the build by itself
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-diag
          path: diag/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nxcompanion-${{ matrix.name }}
          path: nxcompanion-*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Attach to the release (tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
