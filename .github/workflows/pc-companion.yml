# nxnative's PC companion as one standalone app per platform: the window, the whole build pipeline
# (run_as_python) and the build engine itself (payload.zip beside the executable: every file git
# tracks, unpacked once into ~/.nxcompanion/repo/<version> on the user's machine) - so a user needs
# no Python of their own for the window and no checkout of the repository for the build. Windows,
# Linux and a universal2 macOS build; dm/android/tools/freeze.py packs it. bash, make, python3,
# dotnet, Java and the Android SDK stay outside (the companion's Toolchain window guides them in).
#
# CI (pushes and pull requests touching the involved files): the three builds plus three smoke
# tests each - the --check report runs (and unpacks the payload it carries), a script handed to
# the executable imports every third-party module the pipeline uses (lz4, capstone, fontTools,
# nsz, the zstd binding) and exercises a ProcessPoolExecutor, the shader split's own worker
# mechanism (a spawn child re-runs a windowed executable; freeze_support answers it), and the
# payload's own pipeline script runs inside the executable as python3 would run it.
#
# CD (a tag v*): the same builds, packaged (zip on Windows, tar.gz elsewhere) and attached to the
# GitHub release, named after the version pc_companion.py carries.
name: pc-companion

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - 'dm/android/tools/pc_companion.py'
      - 'dm/android/tools/freeze.py'
      - 'dm/android/tests/test_pc_companion.py'
      - 'scripts/build_ipa_from_nsp.py'
      - 'scripts/build_apk_from_nsp.py'
      - '.github/workflows/pc-companion.yml'
  workflow_dispatch:

permissions:
  contents: write   # the release job attaches the executables to the tag's release

jobs:
  build:
    name: Build ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds on 24.04, not ubuntu-latest: the app's bundled Tcl (the window) must run on
          # the LTS people actually have - a build off the newest image's Python carries a libtcl
          # that wants its own brand-new glibc and dies on 24.04/Debian with a loader error, while
          # --check (no Tcl in it) runs everywhere and so never caught it on the runner itself.
          - { os: ubuntu-24.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-universal2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # the version the pipeline's zstd backport targets (3.14+ carries zstd itself)
      - name: The freeze toolchain
        run: python3 -m pip install pyinstaller lz4 capstone fonttools backports.zstd nsz
      - name: "Freeze (the app: the window, the pipeline and the engine it runs on)"
        run: python3 dm/android/tools/freeze.py staging
      - name: "Smoke: the --check report runs (and the payload it carries unpacks)"
        shell: bash
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS) EXE=staging/nxcompanion.app/Contents/MacOS/nxcompanion ;;
            Windows) EXE=staging/nxcompanion/nxcompanion.exe ;;   # a folder build: no extraction per process
            *) EXE=staging/nxcompanion/nxcompanion ;;   # a folder build on Linux too
          esac
          # A windowed app (Windows, the Mac) has no stdout even through a redirect - the smoke
          # reads only exit codes and files, never the app's print output. The report's own 'not
          # ready' on a bare runner is exit 1; anything else is a crash.
          "$EXE" --check > check-out.txt 2>&1 && rc=0 || rc=$?
          [ "$rc" -le 1 ] || { cat check-out.txt; exit "$rc"; }
          echo "--check exited $rc (0 ready, 1 not ready on a bare runner)"
          STAMP=$(find "$HOME/.nxcompanion/repo" -maxdepth 2 -name .payload | head -1)
          test -n "$STAMP"   # the engine really unpacked (--check does it when nothing has yet)
          echo "the build engine unpacked: $(dirname "$STAMP")"
      - name: "Smoke: the payload's own pipeline script runs inside it"
        shell: bash
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS) EXE=staging/nxcompanion.app/Contents/MacOS/nxcompanion ;;
            Windows) EXE=staging/nxcompanion/nxcompanion.exe ;;
            *) EXE=staging/nxcompanion/nxcompanion ;;
          esac
          # the engine --check unpacked into ~/.nxcompanion/repo/<version>: its script must run in
          # the executable as python3 would run it (run_as_python), or every build on a user's
          # machine dies before the first stage. Its exit code is the proof (--help exits 0; a
          # windowed app prints nowhere, so its stdout is not read).
          PAYLOAD_SCRIPT=$(find "$HOME/.nxcompanion/repo" -maxdepth 3 -name build_apk_from_nsp.py | head -1)
          test -n "$PAYLOAD_SCRIPT"
          "$EXE" "$PAYLOAD_SCRIPT" --help
          echo "the payload's script ran: $PAYLOAD_SCRIPT"
      - name: "Smoke: the pipeline's modules and workers run inside it"
        shell: bash
        timeout-minutes: 15
        run: |
          set -eu
          case "${{ runner.os }}" in
            macOS) EXE=staging/nxcompanion.app/Contents/MacOS/nxcompanion ;;
            Windows) EXE=staging/nxcompanion/nxcompanion.exe ;;
            *) EXE=staging/nxcompanion/nxcompanion ;;
          esac
          cat > smoke_modules.py <<'EOF'
          # every third-party module the pipeline imports at run time, imported inside the executable
          import lz4.block, lz4.frame, capstone, capstone.arm64
          from fontTools.ttLib import TTFont
          import nsz
          from backports import zstd
          zstd.ZstdDecompressor().decompress(zstd.ZstdCompressor().compress(b'zstd inside'))   # shader_split's own call
          open('smoke-modules.txt', 'w').write('modules ok')
          EOF
          echo 'smoke: modules...'
          "$EXE" smoke_modules.py
          cat smoke-modules.txt
          echo "smoke: the spawn pool (the shader split's worker mechanism)..."
          cat > smoke_pool.py <<'EOF'
          # a spawn child re-runs a windowed executable; freeze_support must answer it
          import multiprocessing
          from concurrent.futures import ProcessPoolExecutor
          def twice(x): return x * 2
          if __name__ == '__main__':
              open('smoke-pool.txt', 'w').write('start method: ' + multiprocessing.get_start_method() + '\n')
              multiprocessing.set_start_method('spawn', force=True)
              with ProcessPoolExecutor(1) as ex:
                  open('smoke-pool.txt', 'a').write(repr(sorted(ex.map(twice, [1, 2, 3]))))
          EOF
          # a windowed child prints nowhere: watch it from outside, and on a hang show what it got to write
          python3 - "$EXE" <<'EOF' || { echo '--- smoke-pool.txt:'; cat smoke-pool.txt 2>/dev/null || echo '(nothing: the pool never started)'; exit 1; }
          import subprocess, sys, time
          t0 = time.time()
          try:
              r = subprocess.run([sys.argv[1], 'smoke_pool.py'], capture_output=True, timeout=600)
          except subprocess.TimeoutExpired:
              print(f'still running after {time.time()-t0:.0f}s'); sys.exit(1)
          print(f'pool smoke exit {r.returncode} after {time.time()-t0:.0f}s')
          sys.exit(r.returncode or 0)
          EOF
          cat smoke-pool.txt
          grep -F '[2, 4, 6]' smoke-pool.txt
      - name: Package
        shell: bash
        run: |
          set -eu
          V=$(python3 -c 'import re; print(re.search(r"VERSION = .([0-9.]+).", open("dm/android/tools/pc_companion.py").read()).group(1))')
          if [ "${{ runner.os }}" = Windows ]; then
            # Git Bash's tar is GNU tar: its -a only picks a *compression* program from the suffix,
            # and .zip maps to none - a plain tar under a zip's name came out of that. Python's
            # zipfile writes a real zip with the same entries (nxcompanion.exe + _internal/) at
            # the root, wherever the runner runs.
            python3 -c "import shutil; shutil.make_archive('nxcompanion-$V-${{ matrix.name }}', 'zip', 'staging/nxcompanion')"
          elif [ "${{ runner.os }}" = macOS ]; then
            tar czf "nxcompanion-$V-${{ matrix.name }}.tar.gz" -C staging nxcompanion.app
          else
            tar czf "nxcompanion-$V-${{ matrix.name }}.tar.gz" -C staging nxcompanion
          fi
          ls -lh nxcompanion-*
      - name: "The window's libraries run on the LTS floor (Linux)"
        if: matrix.name == 'linux-x86_64'
        run: |
          set -eu
          # the newest GLIBC symbol any bundled library asks for: 2.39 is Ubuntu 24.04's - the
          # image the build runs on - so a binary that wants more cannot run on the LTS it was
          # built for; --check alone would never say so (the Tcl of the window is the one that bites)
          BAD=$(find staging/nxcompanion -name '*.so*' -print0 | xargs -0 objdump -T 2>/dev/null \
                | grep -o 'GLIBC_2\.[0-9]*' | sort -Vu | awk -F. '$2 > 39' || true)
          test -z "$BAD" || { echo "a bundled library needs glibc newer than Ubuntu 24.04's: $BAD"; exit 1; }
          echo 'glibc floor OK: nothing above 2.39'
      - uses: actions/upload-artifact@v4
        with:
          name: nxcompanion-${{ matrix.name }}
          path: nxcompanion-*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Attach to the release (tag)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          overwrite_files: true   # a moved tag rebuilds and replaces the assets
